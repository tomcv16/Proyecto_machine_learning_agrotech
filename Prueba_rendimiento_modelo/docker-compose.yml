services:
  bench:
    build:
      context: .
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cpu
    image: tomato-bench:cpu
    cpus: 4.0
    mem_limit: 4g
    memswap_limit: 4g
    shm_size: 512m
    environment:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
    volumes:
      - ./imagenes:/app/imagenes:ro
      - ./resultados_bench:/app/resultados
    command: ["python", "benchmark.py", "latencia"]